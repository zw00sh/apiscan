[tool.poetry]
name = "apiscan"
version = "0.3.0"
description = "Lightweight API content discovery using Kiterunner .kite wordlists"
license = "AGPL-3.0-only"
authors = []
packages = [{include = "apiscan", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
httpx = {version = ">=0.27", extras = ["http2"]}
exrex = ">=0.11"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0"
pytest-asyncio = ">=0.25"
uvicorn = ">=0.30"

[tool.poetry.scripts]
apiscan = "apiscan.__main__:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
